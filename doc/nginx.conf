#user nobody;
worker_processes 1;

# This default error log path is compiled-in to make sure configuration parsing
# errors are logged somewhere, especially during unattended boot when stderr
# isn't normally logged anywhere. This path will be touched on every nginx
# start regardless of error log location configured here. See
# https://trac.nginx.org/nginx/ticket/147 for more info. 
error_log /var/log/nginx/error.log;

events {
    worker_connections 256;
}


http {
    include mime.types;
    default_type application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log logs/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    gzip on;
    gzip_static on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/javascript
        text/json
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/xhtml+xml
        image/svg+xml
        image/x-icon;

    keepalive_timeout 15s;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    client_max_body_size 1k;
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;

    server {
        listen 80;
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /usr/local/ssl/server.pem;
        ssl_certificate_key /usr/local/ssl/server.key;
        ssl_session_cache shared:SSL:64k;
        ssl_session_timeout 1h;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            root /usr/local/www/nginx;
            index index.html index.htm default.html default.htm;
        }

        location /library {
            root /data;
            index index.html index.htm;
            try_files $uri $uri/ =404;
        }

        location /transmission {
            proxy_pass http://127.0.0.1:9091;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header X-Transmission-Session-Id;
            proxy_redirect off;
            proxy_buffering off;
        }

        error_page 400 401 403 404 405 406 408 409 410 411 412 413 414 415 416 421 429 444 494 495 496 497 500 501 502 503 504 505 /error_pages/$status.html;

        location ^~ /error_pages {
            alias /usr/local/www/httperrm;
            internal;
        }
    }
}
